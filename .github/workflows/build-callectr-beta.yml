name: Build and publish Callectr beta

on:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-callectr-beta.yml"

permissions:
  contents: write

# Callectr development pushes often land minutes apart. Keep only the newest build so GitHub minutes
# are spent testing the code we will actually install, not obsolete intermediate commits.
concurrency:
  group: callectr-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run core recording tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests "app.callectr.recorder.services.recording.RecordingPolicyTest" \
            --tests "app.callectr.recorder.services.call.AnswerWaitTest" \
            --tests "app.callectr.recorder.system.storage.MediaStoreHelperTest" \
            --tests "app.callectr.recorder.services.recording.LiveRecordPromptTest"

      - name: Build beta APK
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and prepare artifact
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p dist
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" dist/Callectr-v0.1.0-beta7-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee dist/aapt-badging.txt
          grep -q "package: name='app.callectr.recorder'" dist/aapt-badging.txt
          grep -q "versionName='0.1.0-beta7'" dist/aapt-badging.txt
          grep -q "application-label:'Callectr'" dist/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/apksigner.txt
          sha256sum dist/Callectr-v0.1.0-beta7-debug.apk | tee dist/Callectr-v0.1.0-beta7-debug.sha256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Callectr-v0.1.0-beta7-debug
          path: |
            dist/Callectr-v0.1.0-beta7-debug.apk
            dist/Callectr-v0.1.0-beta7-debug.sha256.txt
            dist/aapt-badging.txt
            dist/apksigner.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-beta7 >/dev/null 2>&1; then
            gh release upload v0.1.0-beta7               dist/Callectr-v0.1.0-beta7-debug.apk               dist/Callectr-v0.1.0-beta7-debug.sha256.txt               --clobber
          else
            gh release create v0.1.0-beta7               dist/Callectr-v0.1.0-beta7-debug.apk               dist/Callectr-v0.1.0-beta7-debug.sha256.txt               --prerelease               --title "Callectr v0.1.0-beta7"               --notes "Personal Callectr redesign: automatic local MediaStore storage, stale picker migration, minimal home and playback, full-screen personal settings, screenshots enabled for development, live REC controls, no audio-share target, and upstream transcription/community surfaces removed from normal use. Debug-signed CI artifact; the user-facing APK is re-signed with the permanent Callectr key."
          fi
