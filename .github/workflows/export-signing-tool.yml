name: Export Android signing tool

on:
  push:
    paths:
      - ".github/workflows/export-signing-tool.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure build-tools 36
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
          mkdir -p tool/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" tool/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" tool/lib/
      - name: Upload signing tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-36
          path: tool
          retention-days: 7
